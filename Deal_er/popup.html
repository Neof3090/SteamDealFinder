<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="app">
      <header class="row">
        <img src="Icons/Logo.png" alt="logo" class="logo" />
        <img src="Icons/logo_text.png" alt="logo" class="logo_text" />
        <button id="refresh" class="btn">Search</button>
      </header>

      <div id="filters" class="filters">
        <div class="filter">
          <label for="maxPrice">Max Price:</label>
          <input type="number" id="maxPrice" min="0" step="0.1" />
        </div>

        <div class="filter filter--checkbox">
          <label for="showDescription">Show Description:</label>
          <input type="checkbox" id="showDescription" checked />
        </div>
      </div>

      <div id="status" class="status">Ready.</div>
      <ul id="list" class="list"></ul>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
