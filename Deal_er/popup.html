<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="app">
      <header class="row">
        <img src="Icons/Logo.png" alt="logo" class="logo" />
        <img src="Icons/logo_text.png" alt="logo" class="logo_text" />
        
      </header>

      
      <div id="filterBox" class="filterBox">
        <div class="filter">
          <label for="maxPrice">Max Price:</label>
          <input type="number" id="maxPrice" min="0" max="10000" />
        </div>

        <div class="filter">
          <label for="maxDeals">Max Deals:</label>
          <input type="number" id="maxDeals" min="0" max="100" value="40" />
        </div>

        <div class="filter">
          <label for="currency">Currency:</label>
          <select id="currency" value="USD">
            <option value="USD">USD</option>
            <option value="SEK">SEK</option>
          </select>
          
        </div>
        <button id="refresh" class="btn">Search</button>
      </div>

      <div id="status" class="status">Ready.</div>
      <ul id="list" class="list"></ul>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
