<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="app">
      <header id="top_row" class="row">
        <img src="Icons/logo.png" alt="logo" class="logo" />
        <img src="Icons/logo_text.png" alt="logo" class="logo_text" />
      </header>

      <div id="filterBox" class="filterBox">
        <div class="filter">
          <label for="maxPrice">Max Price:</label>
          <input type="range" id="maxPrice" class="rangeInput" value="50" min="0" max="50" />
          <p class="rangeVal" id="maxPriceValue">50</p>
          <p class="valSuffix"  id="maxPriceCurrency">$</p>
        </div>

        <div class="filter">
          <label for="maxDeals">Max Deals:</label>
          <input type="range" id="maxDeals"  class="rangeInput"  min="0" max="60" value="30" />
          <p class="rangeVal" id="maxDealsValue">30</p>
          <p class="valSuffix">deals</p>
        </div>

        <div class="filter">
          <label for="sortBy">Sort by:</label>
            <select id="sortBy">
              <option value="DealRating" selected>DealRating</option>
              <option value="Savings">Savings</option>
              <option value="Price">Price</option>
              <option value="Reviews">Reviews</option>
              <option value="Metacritic">Metacritic</option>
              <option value="Recent">Recent</option>
              <option value="Title">Title</option>
            </select>  
        </div>

        <button id="search" class="btn">Search</button>
      </div>

      <div id="status" class="status">Ready.</div>
      <ul id="dealList" class="list"></ul>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
